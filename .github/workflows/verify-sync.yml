name: verify-sync

# 兑底校验: ① skills/ 与 plugins/ + 两份 marketplace 保持同步 ② 技能内容合法性(frontmatter/引用/映射)
# 若本地装了 pre-commit hook(正常情况),push 上来已同步,此 CI 直接通过
# 若提交者没装 hook 或 hook 没跑,此 CI 会失败拦截

on:
  push:
    branches: [main, 'ci/agile-*']
    paths:
      - 'skills/**'
      - 'plugins/**'
      - 'tests/agile/**'
      - '.github/workflows/verify-sync.yml'
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - 'scripts/sync-plugins.mjs'
      - 'scripts/validate.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'skills/**'
      - 'plugins/**'
      - 'tests/agile/**'
      - '.github/workflows/verify-sync.yml'
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - 'scripts/sync-plugins.mjs'
      - 'scripts/validate.mjs'

permissions:
  contents: read

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run sync (check mode)
        run: node scripts/sync-plugins.mjs --check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Validate skill content
        run: node scripts/validate.mjs

  agile-regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      AGILE_REQUIRE_SYMLINK: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run existing agile regressions
        shell: bash
        run: |
          bash tests/agile/stage.sh
          bash tests/agile/suite.sh
          bash tests/agile/regress.sh
          bash tests/agile/cache.sh

      - name: Verify python and python3 launchers
        run: python -B tests/agile/test_launchers.py

      - name: Verify delivery and require symlink coverage
        run: python -B tests/agile/test_delivery.py
